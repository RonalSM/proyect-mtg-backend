services:
  - type: web
    name: mtgc-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: mtgc-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: SCRYFALL_USER_AGENT
        value: MTGCommanderVirtualTable/1.0.0 (admin@mtgc.local)

databases:
  - name: mtgc-postgres
    plan: free
    region: oregon
    databaseName: mtgc
    user: mtgc_user
